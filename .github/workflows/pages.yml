name: Website veröffentlichen
# Veröffentlicht das Team-Board auf GitHub Pages.
# Voraussetzung: Settings → Pages → Build and deployment → Source: „GitHub Actions“.
on:
  push:
    branches: [main]
  workflow_run:                 # Commits des Montags-Bots lösen keinen push-Lauf aus – darum hier nachziehen
    workflows: ["Spielberichte Montag"]
    types: [completed]
  workflow_dispatch: {}         # per Knopfdruck startbar
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: deployment
        uses: actions/deploy-pages@v4
