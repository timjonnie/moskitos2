name: Spielberichte Montag
on:
  schedule:
    # GitHub startet Zeitpläne oft verspätet oder lässt sie zur vollen Stunde ganz aus.
    # Darum krumme Minuten und ein zweiter Versuch; ohne neue Berichte entsteht kein Commit.
    - cron: "23 5 * * 1"    # Montag 06:23 MEZ / 07:23 MESZ
    - cron: "47 13 * * 1"   # Montag 14:47 MEZ / 15:47 MESZ (Nachzügler, falls der erste Lauf ausfällt)
  workflow_dispatch: {}    # zusätzlich per Knopfdruck startbar
permissions:
  contents: write
jobs:
  abruf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "24" }
      - run: npm install --no-save pdfjs-dist@3.11.174
      - run: node spielberichte_abruf.js
      - name: Änderungen speichern
        run: |
          git config user.name "Gegneranalyse-Bot"
          git config user.email "bot@users.noreply.github.com"
          git add gegner_daten.json
          git diff --cached --quiet || git commit -m "Spielberichte $(date +%d.%m.%Y)"
          git pull --rebase --autostash
          git push
