:root{

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}

button{cursor:pointer}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(92px + env(safe-area-inset-bottom,0px))}

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MONL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=isoOf(new Date());
const dt=iso=>new Date(iso+'T12:00:00');
const fmtD=iso=>{if(!iso)return '';const d=dt(iso);return WD[d.getDay()]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.';};
const fmtDY=iso=>{if(!iso)return '';const d=dt(iso);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();};
const fmtDL=iso=>{if(!iso)return '';const d=dt(iso);return WD[d.getDay()]+', '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();};
const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n||0);
const uid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone=o=>JSON.parse(JSON.stringify(o||{}));

const CATS=['Aufwärmen','Koordination','Abwehr','Angriff','Umschaltspiel','Wurftraining','Torwart','Kondition','Spielform','Sonstiges'];
const CATVAR={'Aufwärmen':'--c-auf','Abwehr':'--c-abw','Angriff':'--c-ang','Torwart':'--c-tw','Kondition':'--c-kon','Spielform':'--c-spi','Umschaltspiel':'--c-ums','Wurftraining':'--c-wur','Koordination':'--c-koo'};
const catTag=c=>`<span class="cat" style="--cc:var(${CATVAR[c]||'--c-son'})">${esc(c||'Sonstiges')}</span>`;
const POS=['TW','LA','RL','RM','RR','RA','KM'];
const KADER=[['F2','Stammkader F2'],['Backup','Backup'],['A-Jgd.','A-Jugend'],['F3','F3'],['F4','F4'],['F1','F1']];
const ST={x:'Dabei','?':'Offen',o:'Absage','-':'Nicht nominiert'};
const SLOTN=['Zeitnehmer','Sekretär','Helfer','Helfer'];

/* ---------- Store ---------- */
const COLS=['players','games','drills','sessions','templates','staff','refs','settings'];
const S={};COLS.forEach(c=>S[c]={});
let db=null,mode='loading',readOnly=false;const loaded=new Set();const pend=new Map();
const LOCKED=window.__MK2T_LOCKED__||null;
const PRISTINE=(()=>{try{if(!LOCKED)return null;const c=document.documentElement.cloneNode(true);const d=c.querySelector('#mkdata');if(!d)return null;d.textContent='window.__MK2T_LOCKED__=/*__DATA__*/null;';return '<!doctype html>\n'+c.outerHTML}catch(e){return null}})();
let BLOBS={},ACCESS=null,USER=null,ROLE=null,RAW=null,BASEAT=null,DIRTY=0;
const canEdit=()=>ROLE==='admin'||ROLE==='trainer';
const roleName=r=>({admin:'Admin',trainer:'Trainer',spieler:'Spielerin'}[r]||'Spielerin');
function imgSrc(u){if(!u)return '';if(u.startsWith('inline:'))return BLOBS[u.slice(7)]||'';if(mode==='static'&&u.startsWith('/_blob/'))return BLOBS[u.slice(7)]||'';return u}
const LKEY='moskitos2-trainertool-v1';
const all=col=>Object.entries(S[col]).map(([id,v])=>Object.assign({id},v));
const cfg=()=>Object.assign({srAdvance:1000,maxSquad:16},S.settings.main||{});

function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const o=JSON.parse(localStorage.getItem(LKEY)||'null');if(o)COLS.forEach(c=>S[c]=o[c]||{})}catch(e){}}
function put(col,id,data){if(readOnly){toast('Du hast hier nur Leserechte.');return}S[col]=Object.assign({},S[col],{[id]:data});if(mode==='static')DIRTY++;queue(col,id,data);render()}
function del(col,id){if(readOnly){toast('Du hast hier nur Leserechte.');return}const c=Object.assign({},S[col]);delete c[id];S[col]=c;if(mode==='static')DIRTY++;queue(col,id,null);render()}
function queue(col,id,data){const k=col+'/'+id;let p=pend.get(k);if(!p){p={};pend.set(k,p)}p.data=data;p.dirty=true;clearTimeout(p.timer);p.timer=setTimeout(()=>flush(k),350);syncChip()}
async function flush(k){const p=pend.get(k);if(!p||p.inflight)return;p.inflight=true;
  while(p.dirty){p.dirty=false;const data=p.data;
    try{await write(k,data)}catch(e){
      const code=e&&e.code;
      if(code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await write(k,data)}catch(e2){toast('Speichern fehlgeschlagen. Bitte später erneut versuchen.')}}
      else if(code==='invalid_argument'){readOnly=true;toast('Speichern nicht möglich: Du hast hier nur Leserechte.')}
      else if(code==='quota_exceeded'){toast('Speicher voll. Lösche alte Einträge und versuche es erneut.')}
      else toast('Speichern fehlgeschlagen.');
    }}
  p.inflight=false;if(!p.dirty)pend.delete(k);syncChip()}
async function write(k,data){if(mode==='db'){const ref=db.doc(k);if(data===null)await ref.delete();else await ref.set(data)}else if(mode==='static')await saveDraft();else saveLocal()}
function syncChip(){const el=$('#sync');if(mode==='loading'){el.className='sync';el.textContent='Lädt …';return}
  if(mode==='local'){el.className='sync local';el.textContent='Nur dieses Gerät';return}
  if(mode==='static'){if(readOnly){el.className='sync ok';el.textContent='Nur lesen'}else if(DIRTY){el.className='sync busy';el.textContent=DIRTY+' Änderung'+(DIRTY===1?'':'en')}else{el.className='sync ok';el.textContent='Aktuell'}return}
  if(pend.size){el.className='sync busy';el.textContent='Speichert …'}else{el.className='sync ok';el.textContent=readOnly?'Nur lesen':'Gespeichert'}}

async function boot(){
  if(LOCKED){bootLocked();return}
  ROLE='admin';
  render();
  let ns=null;
  try{ns=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){ns=null}
  if(ns){db=ns;mode='db';if(window.MKFB&&MKFB.role)ROLE=MKFB.role;
    COLS.forEach(col=>{db.collection(col).onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});
      for(const [k,p] of pend){const i=k.indexOf('/');if(k.slice(0,i)===col){const id=k.slice(i+1);if(p.data===null)delete o[id];else o[id]=p.data}}
      S[col]=o;loaded.add(col);render();syncChip()},
      err=>{if(err&&err.code==='revoked'){readOnly=true}loaded.add(col);render()})});
    try{assetsNS=await window.claude.use('assets')}catch(e){assetsNS=null}
    try{downloadsNS=await window.claude.use('downloads')}catch(e){downloadsNS=null}
    try{sampleNS=await window.claude.use('sample');if(sampleNS){const l=await sampleNS.limits().catch(()=>null);imgOK=!!(l&&l.images);imgLim=l&&l.images||null}}catch(e){sampleNS=null}
    render();
    try{const u=await window.claude.use('user');if(u&&u.can){const c=await u.can('data.write');if(c===false)readOnly=true}}catch(e){}
  }else{mode='local';loadLocal();COLS.forEach(c=>loaded.add(c))}
  if(mode==='db')$('#menuBtn').hidden=false;
  syncChip();render();
}

/* ---------- Verschlüsselung & Anmeldung (kompatibel zur Spielanalyse) ---------- */
const ITER=310000;const TE=new TextEncoder(),TD=new TextDecoder();
const b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const normUser=u=>String(u||'').trim().toLowerCase();
async function sha(s){const d=new Uint8Array(await crypto.subtle.digest('SHA-256',TE.encode('moskitos2:'+s)));return [...d].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function kek(pw,salt,iter){const base=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function wrapFor(user,pw,raw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await kek(pw,salt,ITER);
  const wk=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:TE.encode(user)},k,raw));return {u:user,salt:b64e(salt),iter:ITER,iv:b64e(iv),wk:b64e(wk)}}
async function sealPayload(raw,obj){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(JSON.stringify(obj))));return {iv:b64e(iv),ct:b64e(ct)}}
async function openPayload(raw,L){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  return JSON.parse(TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(L.iv)},key,b64d(L.ct))))}
async function unlockKey(user,pw,L){const h=await sha(user);const e=L.users.find(x=>x.h===h);if(!e)throw new Error('auth');
  const k=await kek(pw,b64d(e.salt),e.iter);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv),additionalData:TE.encode(user)},k,b64d(e.wk)))}

async function saveDraft(){if(mode!=='static'||!RAW)return;try{const inl={};Object.keys(BLOBS).filter(k=>k.startsWith('img-')).forEach(k=>inl[k]=BLOBS[k]);
  const sealed=await sealPayload(RAW,{baseAt:BASEAT,dirty:DIRTY,data:S,blobs:inl,users:ACCESS.users});localStorage.setItem('mk2tdraft',JSON.stringify(sealed))}catch(e){toast('Änderung konnte auf diesem Gerät nicht gesichert werden.')}}
async function loadDraft(){try{const r=localStorage.getItem('mk2tdraft');if(!r)return null;const d=await openPayload(RAW,JSON.parse(r));if(d.baseAt!==BASEAT){localStorage.removeItem('mk2tdraft');return null}return d}catch(e){return null}}
async function bootStatic(D,raw,user){
  RAW=raw;USER=user;BASEAT=D.exportedAt||null;BLOBS=D.blobs||{};
  const users=(D.access&&D.access.users)||[];const me=users.find(u=>u.u===user);ROLE=me?(me.role||'spieler'):'spieler';
  ACCESS={dataKey:b64e(raw),users};
  COLS.forEach(c=>S[c]=(D.data&&D.data[c])||{});
  if(canEdit()){const dr=await loadDraft();if(dr){COLS.forEach(c=>S[c]=(dr.data&&dr.data[c])||S[c]);Object.assign(BLOBS,dr.blobs||{});ACCESS.users=dr.users||ACCESS.users;DIRTY=dr.dirty||1}}
  readOnly=!canEdit();document.body.classList.toggle('ro',readOnly);
  mode='static';COLS.forEach(c=>loaded.add(c));
  if(!canEdit()&&ui.tab==='sr')ui.tab='spiele';
  $('#login').hidden=true;$('#menuBtn').hidden=false;syncChip();render();
}
async function tryKey(raw,L,user){const D=await openPayload(raw,L);await bootStatic(D,raw,user)}
function bootLocked(){
  const showLogin=()=>{if(window.MKSite&&MKSite.redirect('training'))return;$('#login').hidden=false;setTimeout(()=>{const i=$('#lgUser');if(i)i.focus()},50)};
  if(!(window.crypto&&crypto.subtle)){showLogin();$('#lgMsg').textContent='Dieser Browser unterstützt die Anmeldung nicht. Bitte in Safari oder Chrome öffnen.';return}
  let sv=null;try{sv=JSON.parse(sessionStorage.getItem('mk2tkey')||localStorage.getItem('mk2tkey')||'null')}catch(x){}
  if(sv&&sv.k&&sv.u){tryKey(b64d(sv.k),LOCKED,sv.u).catch(()=>{try{sessionStorage.removeItem('mk2tkey');localStorage.removeItem('mk2tkey')}catch(x){}showLogin()})}else showLogin();
}
async function doLogin(){
  const btn=$('#lgBtn'),msg=$('#lgMsg');const u=normUser($('#lgUser').value),pw=$('#lgPass').value;if(!u||!pw)return;
  btn.disabled=true;btn.textContent='Anmeldung läuft …';msg.textContent='';
  try{const raw=await unlockKey(u,pw,LOCKED);await tryKey(raw,LOCKED,u);
    const store=$('#lgKeep').checked?localStorage:sessionStorage;try{store.setItem('mk2tkey',JSON.stringify({u,k:b64e(raw)}))}catch(x){}}
  catch(e){msg.textContent='Benutzername oder Passwort stimmt nicht.'}
  btn.disabled=false;btn.textContent='Anmelden'}
function logout(){if(window.MKSite&&MKSite.logout())return;try{sessionStorage.removeItem('mk2tkey');localStorage.removeItem('mk2tkey')}catch(x){}location.reload()}

/* ---------- Website-Export & Abgleich ---------- */
async function loadAccess(){if(mode!=='db')return ACCESS;try{const d=await db.doc('secure/access').get();ACCESS=d.exists?clone(d.data()):null}catch(e){ACCESS=null}return ACCESS}
async function saveAccess(A){if(mode==='db'){await db.doc('secure/access').set(A);ACCESS=A}else{ACCESS=A;DIRTY++;await saveDraft()}}
function referencedImgs(){const set=new Set();all('drills').forEach(d=>{if(d.sketch)set.add(d.sketch)});all('templates').forEach(t=>{if(t.extraSketch)set.add(t.extraSketch)});return [...set]}
async function toDataURL(url){const r=await fetch(url);if(!r.ok)throw new Error('img');const b=await r.blob();return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)})}
async function buildSite(){
  const A=mode==='db'?await loadAccess():ACCESS;
  if(!A||!A.dataKey||!(A.users||[]).length)throw Object.assign(new Error('noaccess'),{code:'noaccess'});
  const tpl=mode==='static'?PRISTINE:window.__MK2T_TPL__;if(!tpl)throw Object.assign(new Error('tpl'),{code:'tpl'});
  const raw=b64d(A.dataKey);const blobs={};
  for(const u of referencedImgs()){const id=u.startsWith('inline:')?u.slice(7):u.startsWith('/_blob/')?u.slice(7):null;if(!id)continue;
    if(BLOBS[id]){blobs[id]=BLOBS[id];continue}if(u.startsWith('/_blob/')&&mode==='db'){try{blobs[id]=await toDataURL(u)}catch(e){}}}
  const data={};COLS.forEach(c=>data[c]=S[c]);
  const inner=A.users.map(u=>({u:u.u,role:u.role||'spieler',salt:u.salt,iter:u.iter,iv:u.iv,wk:u.wk}));
  const now=new Date().toISOString();
  const sealed=await sealPayload(raw,{data,blobs,exportedAt:now,access:{users:inner}});
  const users=[];for(const u of A.users)users.push({h:await sha(u.u),salt:u.salt,iter:u.iter,iv:u.iv,wk:u.wk});
  const locked={v:1,iv:sealed.iv,ct:sealed.ct,users};
  return tpl.replace('/*__DATA__*/null',()=>JSON.stringify(locked).replace(/</g,'\\u003c'));
}
function plainDownload(name,blob){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
let siteBusy=false;
async function exportSite(){if(siteBusy)return;siteBusy=true;toast('index.html wird erstellt …');
  try{const html=await buildSite();const blob=new Blob([html],{type:'text/html'});
    if(mode==='db'){if(!downloadsNS)throw Object.assign(new Error('dl'),{code:'dl'});await downloadsNS.save({filename:'index.html',data:blob})}else plainDownload('index.html',blob);
    toast('index.html erstellt – jetzt bei Netlify hochladen')}
  catch(e){console.error('export',e);const c=e&&e.code;toast(c==='noaccess'?'Lege zuerst einen Zugang an.':c==='declined'?'Abgebrochen.':c==='dl'?'Herunterladen ist hier nicht möglich.':'Export fehlgeschlagen.')}
  siteBusy=false}
async function readSiteFile(f){
  const txt=await f.text();const m=txt.match(/window\.__MK2T_LOCKED__=(\{[\s\S]*?\});<\/script>/);if(!m)throw Object.assign(new Error('format'),{code:'format'});
  const A=await loadAccess();if(!A||!A.dataKey)throw Object.assign(new Error('key'),{code:'key'});
  try{return await openPayload(b64d(A.dataKey),JSON.parse(m[1]))}catch(e){throw Object.assign(new Error('key'),{code:'key'})}}
async function applySite(D){
  const total=COLS.reduce((a,c)=>a+Object.keys((D.data||{})[c]||{}).length,0);let n=0;
  const up={};
  for(const c of COLS){const inc=(D.data||{})[c]||{};
    for(const [id,v] of Object.entries(inc)){let o=clone(v);
      for(const f of ['sketch','extraSketch']){if(typeof o[f]==='string'&&o[f].startsWith('inline:')){const bid=o[f].slice(7);
        if(up[bid])o[f]=up[bid];else if(assetsNS&&D.blobs&&D.blobs[bid]){try{const b=await (await fetch(D.blobs[bid])).blob();const r=await assetsNS.upload(b);up[bid]=r.url;o[f]=r.url}catch(e){}}}}
      if(JSON.stringify(o)!==JSON.stringify(S[c][id]))await db.doc(c+'/'+id).set(o);n++;if(n%20===0)toast('Übernehme … '+n+' / '+total)}
    for(const id of Object.keys(S[c]))if(!(id in inc))await db.doc(c+'/'+id).delete()}
  const A=await loadAccess();if(A&&D.access&&(D.access.users||[]).length){await saveAccess(Object.assign({},A,{users:D.access.users}))}
  toast('Stand aus der Netlify-Datei übernommen')}

let rq=false;
function render(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;draw()})}
function keepFocus(root,fn){const ae=document.activeElement;const id=ae&&ae.id&&root.contains(ae)?ae.id:null;let sel=null;try{if(id&&ae.selectionStart!=null)sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}
  fn();if(id){const el=document.getElementById(id);if(el){el.focus({preventScroll:true});if(sel)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}}
function draw(){renderTabs();const v=$('#view');
  const titles={uebungen:'Übungen',training:'Saisonplanung',spiele:ui.players?'Spielerinnen':'Kaderplaner',zn:'ZN & Sekretäre',sr:'SR-Kosten'};
  $('#vtitle').textContent=titles[ui.tab];
  keepFocus(v,()=>{v.innerHTML=(loaded.size<COLS.length&&mode!=='local')?`<div class="empty"><b>Daten werden geladen</b>Einen Moment …</div>`:(VIEWS[ui.tab]()+localNote())})}
function localNote(){return mode==='local'?`<p class="note">Vorschau-Modus: Änderungen werden nur in diesem Browser gespeichert.</p>`:''}

const gamesSorted=()=>all('games').sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
const nextGame=()=>gamesSorted().find(g=>g.date>=TODAY);
const haTag=g=>g.home===true?'<span class="pill h">Heim</span>':g.home===false?'<span class="pill a">Auswärts</span>':'<span class="pill">offen</span>';
const compTag=g=>!g.comp||g.comp==='Liga'?'':(/Pokal/.test(g.comp)?`<span class="pill pokal">${esc(g.comp)}</span>`:`<span class="pill">${esc(g.comp)}</span>`);
function dateBox(iso,next){const d=dt(iso);return `<div class="datebox ${next?'next':''}"><div class="wd">${WD[d.getDay()]}</div><div class="dd num">${d.getDate()}</div><div class="mm">${MON[d.getMonth()]}</div></div>`}
function tally(g){const t={x:0,'?':0,o:0,'-':0,tw:0};const sq=g.squad||{};for(const pid in sq){const s=sq[pid];if(t[s]!=null)t[s]++;if(s==='x'&&(S.players[pid]||{}).pos==='TW')t.tw++}return t}
const sessMin=s=>(s.drills||[]).reduce((a,id)=>a+(+(S.drills[id]||{}).minutes||0),0);

    .sort((a,b)=>CATS.indexOf(a.category)-CATS.indexOf(b.category)||a.title.localeCompare(b.title,'de'));

function planView(){
  const ss=all('sessions').sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
  const up=ss.filter(s=>s.date>=TODAY),past=ss.filter(s=>s.date<TODAY);
  const nxt=up[0];const shown=ui.showPast?ss:up;
  let html=`<div class="row between"><span class="sub">${up.length} geplant · ${past.length} vergangen</span><div class="row"><button class="btn" data-a="series-new">Serie anlegen</button><button class="btn primary" data-a="sess-new">+ Einheit</button></div></div>`;
  if(nxt){const m=sessMin(nxt);html+=`<button class="card item" data-a="sess-edit" data-id="${nxt.id}" style="padding:14px">
    ${dateBox(nxt.date,true)}<div class="grow"><div class="sub">Nächstes Training · ${fmtDL(nxt.date)}${nxt.time?' · '+esc(nxt.time)+' Uhr':''}</div>
    <div class="t" style="font-size:17px">${esc(nxt.focus||'Schwerpunkt offen')}</div>
    <div class="sub">${(nxt.drills||[]).length} Übungen · ${m} von ${nxt.minutes||90} min verplant</div>
    <div class="bar"><i class="${m>(nxt.minutes||90)?'over':m===(nxt.minutes||90)?'full':''}" style="width:${Math.min(100,Math.round(m/(nxt.minutes||90)*100))}%"></i></div></div></button>`}
  if(past.length)html+=`<div class="chips"><button class="chip" data-a="toggle" data-v="showPast" aria-pressed="${ui.showPast}">Vergangene anzeigen</button></div>`;
  if(!ss.length)return html+`<div class="empty"><b>Noch keine Trainingseinheiten</b>Mit „Serie anlegen“ erzeugst du alle Termine der Saison auf einmal, z. B. jeden Dienstag und Donnerstag bis April. Danach ordnest du jeder Einheit Übungen aus der Datenbank zu.</div>`;
  let cur='';html+='<div class="list">';
  shown.forEach(s=>{const d=dt(s.date);const key=d.getFullYear()+'-'+d.getMonth();if(key!==cur){cur=key;html+=`<h2 class="sec">${MONL[d.getMonth()]} ${d.getFullYear()}</h2>`}
    const m=sessMin(s),tot=s.minutes||90,cats=[...new Set((s.drills||[]).map(id=>(S.drills[id]||{}).category).filter(Boolean))];
    html+=`<button class="item ${s.date<TODAY?'past':''}" data-a="sess-edit" data-id="${s.id}">${dateBox(s.date,false)}
      <div class="grow"><div class="t">${esc(s.focus||'Schwerpunkt offen')}</div><div class="sub">${s.time?esc(s.time)+' Uhr · ':''}${(s.drills||[]).length} Übungen</div>
      ${cats.length?`<div class="row" style="margin-top:3px;gap:10px">${cats.map(catTag).join('')}</div>`:''}

  if(!shown.length)html+=`<div class="empty"><b>Keine kommenden Einheiten</b>Leg eine neue Einheit oder Serie an.</div>`;
  return html+'</div>';
}

function gameView(id){
  const g=S.games[id];const t=tally(g);const mx=cfg().maxSquad;const sq=g.squad||{};
  const allp=all('players');const ps=allp.filter(p=>p.active!==false);const inact=allp.filter(p=>p.active===false);
  const posc={};POS.forEach(p=>posc[p]=0);allp.forEach(p=>{if(sq[p.id]==='x'&&posc[p.pos]!=null)posc[p.pos]++});
  const row=p=>{const s=sq[p.id];const extra=s&&!ST[s]?`<span class="pill">${esc(s)}</span>`:'';
    return `<div class="prow ${s==='x'?'in':''}"><div class="nr num">${esc(p.nr||'–')}</div><div class="pname"><div class="t">${esc(p.name)}</div>
    <div class="sub">${esc(p.pos||'')}${p.note?' · '+esc(p.note):''} ${extra}</div></div>
    <div class="seg" role="group" aria-label="Status ${esc(p.name)}">${['x','?','o','-'].map(v=>`<button data-a="st" data-p="${p.id}" data-v="${v}" aria-pressed="${s===v}" title="${ST[v]}">${v==='x'?'✓':v==='o'?'✕':v==='-'?'–':'?'}</button>`).join('')}</div></div>`};
  const byPos=(a,b)=>POS.indexOf(a.pos)-POS.indexOf(b.pos)||a.name.localeCompare(b.name,'de');
  const stamm=ps.filter(p=>p.kader==='F2').sort(byPos);
  let helpers='';
  KADER.slice(1).forEach(([k,l])=>{const list=ps.filter(p=>p.kader===k).sort(byPos);if(!list.length)return;const n=list.filter(p=>sq[p.id]==='x').length;const act=list.some(p=>sq[p.id]);
    helpers+=`<details class="grp" ${act||ui.expandHelp?'open':''}><summary><span>${l} <span class="num">· ${list.length}</span>${n?` · <span style="color:var(--ok)">${n} dabei</span>`:''}</span></summary><div class="list">${list.map(row).join('')}</div></details>`});
  if(inact.length){const n=inact.filter(p=>sq[p.id]==='x').length;helpers+=`<details class="grp" ${inact.some(p=>sq[p.id])?'open':''}><summary><span>Inaktiv <span class="num">· ${inact.length}</span>${n?` · <span style="color:var(--ok)">${n} dabei</span>`:''}</span></summary><div class="list">${inact.sort(byPos).map(row).join('')}</div></details>`}
  return `<div><button class="back" data-a="game-back">‹ Alle Spiele</button></div>
  <div class="card gamehead"><div class="row between"><div class="row" style="gap:6px">${haTag(g)}${compTag(g)}</div><button class="btn sm" data-a="game-edit" data-id="${id}">Bearbeiten</button></div>
    <div class="opp">${esc(g.opponent||'Gegner offen')}</div><div class="sub">${fmtDL(g.date)}${g.time?' · '+esc(g.time)+' Uhr':''}${g.venue?' · '+esc(g.venue):''}</div>${g.note?`<div class="note" style="margin-top:8px">${esc(g.note)}</div>`:''}</div>
  <div class="squadhead"><div class="stats">
    <div class="stat"><div class="k">Dabei</div><div class="v num ${t.x>mx?'bad':t.x===mx?'ok':''}">${t.x}<span style="font-size:16px;color:var(--muted)"> / ${mx}</span></div></div>
    <div class="stat"><div class="k">Torhüterinnen</div><div class="v num ${t.x&&!t.tw?'bad':''}">${t.tw}</div></div>
    <div class="stat"><div class="k">Offen · Absage</div><div class="v num">${t['?']} · ${t.o}</div></div></div>
    <div class="posline" style="margin-top:8px">${POS.map(p=>`<span class="${posc[p]?'':'zero'}">${p} ${posc[p]}</span>`).join('')}</div></div>
  ${t.x>mx?`<p class="note warn">Mehr als ${mx} Spielerinnen auf „Dabei“. Für den Spielbericht ${t.x-mx} streichen.</p>`:''}
  <div class="row"><button class="btn" data-a="copy-squad" data-id="${id}">Kader als Text kopieren</button></div>
  <h2 class="sec">Stammkader F2 · ${stamm.filter(p=>sq[p.id]==='x').length} dabei</h2>
  <div class="list">${stamm.map(row).join('')||'<div class="empty">Keine Stammspielerinnen angelegt.</div>'}</div>
  <div class="row between"><h2 class="sec">Aushelferinnen</h2><button class="btn sm" data-a="player-new">+ Spielerin</button></div>${helpers||'<div class="empty">Keine Aushelferinnen angelegt.</div>'}
  <p class="sub">✓ dabei · ? offen · ✕ Absage · – nicht nominiert. Nochmal tippen hebt den Status auf.</p>`;
}
function playersView(){
  const ps=all('players');const past=gamesSorted().filter(g=>g.date<=TODAY);
  const apps=id=>{let l=0,t=0;past.forEach(g=>{if((g.squad||{})[id]==='x'){if(g.comp==='Test')t++;else l++}});return [l,t]};
  let html=`<div class="row between"><button class="back" data-a="players-back">‹ Kaderplaner</button><button class="btn primary" data-a="player-new">+ Spielerin</button></div>
  <p class="sub">Einsätze zählen alle vergangenen Spiele mit Status „Dabei“ (Saison · Test).</p>`;
  const team=cfg().coaches||[];
  html+=`<div class="row between"><h2 class="sec">Trainerteam</h2><button class="btn sm" data-a="team-edit">Bearbeiten</button></div><div class="card">${team.length?team.map(c=>`<div class="srline"><span>${esc(c.name)}</span><span class="sub">${esc(c.role)}</span></div>`).join(''):'<span class="sub">Noch niemand eingetragen.</span>'}</div>`;
  KADER.forEach(([k,l])=>{const list=ps.filter(p=>p.kader===k).sort((a,b)=>POS.indexOf(a.pos)-POS.indexOf(b.pos)||a.name.localeCompare(b.name,'de'));if(!list.length)return;
    html+=`<h2 class="sec">${l} · ${list.length}</h2><div class="list">${list.map(p=>{const [a,b]=apps(p.id);return `<button class="item ${p.active===false?'past':''}" data-a="player-edit" data-id="${p.id}" style="align-items:center">
      <div class="nr num">${esc(p.nr||'–')}</div><div class="grow"><div class="t">${esc(p.name)}</div><div class="sub">${esc(p.pos||'')}${p.jahrgang?' · Jg. '+p.jahrgang:''}${p.note?' · '+esc(p.note):''}${p.active===false?' · inaktiv':''}</div></div>
      <div class="mins num">${a}<small>· ${b} Test</small></div></button>`}).join('')}</div>`});
  const other=ps.filter(p=>!KADER.some(([k])=>k===p.kader));
  if(other.length)html+=`<h2 class="sec">Ohne Kader</h2><div class="list">${other.map(p=>`<button class="item" data-a="player-edit" data-id="${p.id}"><div class="grow"><div class="t">${esc(p.name)}</div></div></button>`).join('')}</div>`;
  if(!ps.length)html+=`<div class="empty"><b>Noch keine Spielerinnen</b>Leg Stammspielerinnen und Aushelferinnen an.</div>`;
  return html;
}

VIEWS.zn=()=>{

  const gs=gamesSorted().filter(g=>(g.znNeed||0)>0);const shown=ui.znPast?gs:gs.filter(g=>g.date>=TODAY);
  const open=gs.filter(g=>g.date>=TODAY).reduce((a,g)=>a+Math.max(0,(g.znNeed||0)-(g.zn||[]).filter(Boolean).length),0);
  let html=`<div class="stats"><div class="stat"><div class="k">Heimspiele offen</div><div class="v num">${gs.filter(g=>g.date>=TODAY).length}</div></div>
   <div class="stat"><div class="k">Unbesetzte Plätze</div><div class="v num ${open?'bad':'ok'}">${open}</div></div>
   <div class="stat"><div class="k">Personen</div><div class="v num">${staff.length}</div></div></div>
  <div class="chips"><button class="chip" data-a="toggle" data-v="znPast" aria-pressed="${ui.znPast}">Vergangene anzeigen</button></div>
  <div class="list">`;
  shown.forEach(g=>{const z=g.zn||[];const filled=z.filter(Boolean).length;const need=g.znNeed||0;
    html+=`<div class="card ${g.date<TODAY?'past':''}"><div class="row between" style="align-items:flex-start;flex-wrap:nowrap"><div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:12px">${dateBox(g.date,false)}<div style="min-width:0"><div class="t">${esc(g.opponent)}</div><div class="sub">${g.time?esc(g.time)+' Uhr · ':''}${esc(g.venue||'')}</div></div></div>
      <span class="pill ${filled>=need?'ok':'warn'}">${filled>=need?'besetzt':(need-filled)+' offen'}</span></div>
      ${Array.from({length:need},(_,i)=>{const cur=z[i]||'';return `<div class="slot"><label for="zn-${g.id}-${i}">${SLOTN[i]||'Helfer'}</label>
        <select class="input ${cur?'':'open'}" id="zn-${g.id}-${i}" data-a="zn" data-g="${g.id}" data-i="${i}"><option value="">— offen —</option>${staff.map(s=>`<option value="${s.id}" ${cur===s.id?'selected':''}>${esc(s.name)} (${cnt[s.id]||0})</option>`).join('')}${cur&&!S.staff[cur]?`<option value="${cur}" selected>(gelöscht)</option>`:''}</select></div>
        ${cur&&S.staff[cur]&&S.staff[cur].phone?`<div class="sub" style="padding-left:100px">Tel. <span class="phone">${esc(S.staff[cur].phone)}</span></div>`:''}`}).join('')}</div>`});
  if(!shown.length)html+=`<div class="empty"><b>Keine Heimspiele mit Bedarf</b>Bei jedem Spiel legst du unter „Bearbeiten“ fest, wie viele Zeitnehmer/Sekretäre gebraucht werden.</div>`;
  html+=`</div><div class="row between"><h2 class="sec">Personen</h2><button class="btn sm" data-a="staff-new">+ Person</button></div><div class="list">`+
    staff.map(s=>`<div class="item" style="align-items:center"><div class="grow"><div class="t">${esc(s.name)}</div><div class="sub">${s.phone?`<span class="phone">${esc(s.phone)}</span>`:'keine Nummer'}</div></div>
      <span class="pill num">${cnt[s.id]||0}×</span>${s.phone?`<button class="btn sm ghost" data-a="copy" data-v="${esc(s.phone)}">Kopieren</button>`:''}<button class="btn sm" data-a="staff-edit" data-id="${s.id}">Ändern</button></div>`).join('')+
    (staff.length?'':'<div class="empty"><b>Noch keine Personen</b>Leg Zeitnehmer und Sekretäre mit Handynummer an.</div>')+'</div>';

VIEWS.sr=()=>{
  const c=cfg();const gs=gamesSorted();
  const withCost=gs.filter(g=>(g.sr||[]).length||(g.home===true));
  const spent=gs.reduce((a,g)=>a+(g.sr||[]).reduce((x,e)=>x+(+e.amount||0),0),0);
  const rest=c.srAdvance-spent;const games=gs.filter(g=>(g.sr||[]).some(e=>+e.amount>0)).length;
  let run=c.srAdvance;
  let html=`<div class="stats"><button class="stat hero" data-a="adv-edit" style="text-align:left;font:inherit;color:inherit;cursor:pointer">
     <div><div class="k">Rest vom SR-Vorschuss</div><div class="v num ${rest<0?'bad':''}" style="font-size:40px">${eur(rest)}</div></div>
     <div class="sub num" style="text-align:right">Vorschuss ${eur(c.srAdvance)}<br>tippen zum Ändern</div>
     <div class="bar" style="width:100%;height:8px"><i class="${rest<0?'over':''}" style="width:${Math.min(100,c.srAdvance?spent/c.srAdvance*100:0)}%"></i></div></button>
   <div class="stat"><div class="k">Ausgegeben</div><div class="v num">${eur(spent)}</div></div>
   <div class="stat"><div class="k">Spiele mit Kosten</div><div class="v num">${games}</div></div>
   <div class="stat"><div class="k">Ø pro Spiel</div><div class="v num">${eur(games?spent/games:0)}</div></div></div>
  <h2 class="sec">Pro Spiel</h2><div class="list">`;
  withCost.forEach(g=>{const es=g.sr||[];const sum=es.reduce((a,e)=>a+(+e.amount||0),0);run-=sum;
    html+=`<div class="card ${g.date<TODAY?'':''}"><div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><div class="row" style="flex-wrap:nowrap;gap:12px;align-items:flex-start">${dateBox(g.date,false)}<div style="min-width:0"><div class="row" style="gap:6px">${haTag(g)}${compTag(g)}</div><div class="t">${esc(g.opponent)}</div>${es.length?`<div class="rest">Rest danach ${eur(run)}</div>`:''}</div></div>
      <div style="text-align:right"><div class="mins num" style="font-size:20px">${eur(sum)}</div></div></div>
      ${es.length?`<div style="margin-top:6px">${es.map((e,i)=>`<div class="srline"><button data-a="sr-edit" data-g="${g.id}" data-i="${i}">${esc((S.refs[e.ref]||{}).name||'Unbekannt')}</button><span class="amount">${eur(e.amount)}</span></div>`).join('')}</div>`:''}
      <div class="row" style="margin-top:8px"><button class="btn sm" data-a="sr-new" data-g="${g.id}">+ Kosten erfassen</button></div></div>`});
  html+='</div>';
  const per={};gs.forEach(g=>(g.sr||[]).forEach(e=>{per[e.ref]=per[e.ref]||{n:0,s:0};per[e.ref].n++;per[e.ref].s+=+e.amount||0}));
  const pr=Object.entries(per).sort((a,b)=>b[1].s-a[1].s);
  const used={};gs.forEach(g=>(g.sr||[]).forEach(e=>used[e.ref]=(used[e.ref]||0)+1));const rs=all('refs').sort((a,b)=>a.name.localeCompare(b.name,'de'));
  html+=`<div class="row between"><h2 class="sec">Schiedsrichter · ${rs.length}</h2><button class="btn sm" data-a="ref-new">+ Schiedsrichter/in</button></div>
  <details class="grp"><summary><span>Liste anzeigen</span></summary><div class="list">${rs.map(r=>`<button class="item" data-a="ref-edit" data-id="${r.id}" style="align-items:center"><div class="grow"><div class="t">${esc(r.name)}</div></div><span class="pill num">${used[r.id]||0}×</span></button>`).join('')||'<div class="empty">Noch keine Schiedsrichter angelegt.</div>'}</div></details>`;
  html+=`<details class="grp"><summary><span>Kosten pro Schiedsrichter · ${pr.length}</span></summary><div class="card">${pr.map(([r,v])=>`<div class="srline"><span>${esc((S.refs[r]||{}).name||'Unbekannt')} <span class="sub">· ${v.n}×</span></span><span class="amount">${eur(v.s)}</span></div>`).join('')||'<div class="sub">Noch keine Einträge.</div>'}</div></details>`;
  return html;
};

/* ---------- Sheets ---------- */
function openSheet(kind,draft){ui.sheet=kind;ui.draft=draft;ui.confirm=false;ui.picker=false;ui.pcat='Alle';drawSheet();document.body.style.overflow='hidden'}
function closeSheet(){ui.sheet=null;ui.draft=null;$('#sheetroot').innerHTML='';document.body.style.overflow=''}
function drawSheet(){const root=$('#sheetroot');if(!ui.sheet){root.innerHTML='';return}const s=SHEETS[ui.sheet];const sb=root.querySelector('.sb');const st=sb?sb.scrollTop:0;
  keepFocus(root,()=>{root.innerHTML=`<div class="backdrop" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(s.title())}"><div class="grab"></div>
    <div class="sh"><b>${esc(s.title())}</b><button class="btn sm ghost" data-a="close">Schließen</button></div><div class="sb">${s.body()}</div>
    <div class="sf">${s.canDelete&&s.canDelete()?(ui.confirm?`<button class="btn danger solid" data-a="del-yes">Wirklich löschen</button>`:`<button class="btn danger" data-a="del">Löschen</button>`):'<span></span>'}<div class="row">${s.extra?s.extra():''}<button class="btn primary" data-a="save" ${s.saveDisabled&&s.saveDisabled()?'disabled':''}>${s.saveLabel?s.saveLabel():'Speichern'}</button></div></div></div>`});
  const nb=root.querySelector('.sb');if(nb)nb.scrollTop=st}
const F=(label,inner)=>`<label class="fld"><span>${label}</span>${inner}</label>`;
const inp=(f,v,type,extra)=>`<input class="input" id="f-${f}" data-f="${f}" type="${type||'text'}" value="${esc(v??'')}" ${extra||''}>`;
const sel=(f,v,opts)=>`<select class="input" id="f-${f}" data-f="${f}">${opts.map(o=>{const [val,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}" ${String(v)===String(val)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;

function seriesDates(d){if(!d.from||!d.to||!d.days.length)return[];const ex=new Set(all('sessions').map(s=>s.date));
  const skip=new Set(String(d.skip||'').split(/[,;\s]+/).filter(Boolean).map(s=>{const m=s.match(/^(\d{1,2})\.(\d{1,2})\.?(\d{2,4})?$/);if(!m)return'';const dd=pad(m[1]),mm=pad(m[2]);let y=m[3]?(m[3].length===2?'20'+m[3]:m[3]):(+mm>=7?d.from.slice(0,4):d.to.slice(0,4));return y+'-'+mm+'-'+dd}));
  const out=[];let cur=dt(d.from);const end=dt(d.to);let guard=0;while(cur<=end&&guard++<400){const iso=isoOf(cur);if(d.days.includes(cur.getDay())&&!ex.has(iso)&&!skip.has(iso))out.push(iso);cur.setDate(cur.getDate()+1)}return out}

function loadScript(src){if(loaded_[src])return loaded_[src];return loaded_[src]=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=()=>res();sc.onerror=()=>{delete loaded_[src];rej(new Error('Skript konnte nicht geladen werden'))};document.head.appendChild(sc)})}

const T=s=>String(s??'').replace(/[\u2460-\u2473]/g,c=>'('+(c.charCodeAt(0)-0x245F)+')').replace(/[⇒⟹]/g,'=>').replace(/[→➔⟶]/g,'->').replace(/←/g,'<-').replace(/↳/g,'->').replace(/[↑]/g,'^').replace(/∞/g,'Acht-').replace(/[′’‘‚]/g,"'").replace(/[″“”„]/g,'"').replace(/[–—]/g,'-').replace(/•/g,'-').replace(/…/g,'...').replace(/€/g,'EUR').replace(/×/g,'x').replace(/≈/g,'ca.').replace(/[^\x00-\xFF]/g,'');
async function imgData(url){
  try{const r=await fetch(url);if(!r.ok)throw 0;const b=await r.blob();const d=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)});
    const wh=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res([i.naturalWidth,i.naturalHeight]);i.onerror=rej;i.src=d});return {d,w:wh[0],h:wh[1],f:/png/.test(b.type)?'PNG':'JPEG'}}
  catch(e){try{const i=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});const c=document.createElement('canvas');c.width=i.naturalWidth;c.height=i.naturalHeight;c.getContext('2d').drawImage(i,0,0);return {d:c.toDataURL('image/png'),w:c.width,h:c.height,f:'PNG'}}catch(e2){return null}}}
function addMin(t,m){if(!/^\d{1,2}:\d{2}$/.test(t||''))return '';const [h,mi]=t.split(':').map(Number);const x=h*60+mi+m;return pad(Math.floor(x/60)%24)+':'+pad(x%60)}
let exporting=false;
async function exportPdf(s){
  if(!downloadsNS&&mode!=='static'){toast('PDF-Export ist hier nicht verfügbar.');return}if(exporting)return;exporting=true;toast('PDF wird erstellt …');
  try{await loadScript(CDN.jspdf);const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
    const W=210,H=297,M=15,CW=W-2*M,BOT=H-16;let y=M;
    const ink=[20,32,46],mute=[90,104,120],acc=[28,79,214];
    const list=(s.drills||[]).map(id=>S.drills[id]).filter(Boolean);const tot=list.reduce((a,x)=>a+(+x.minutes||0),0);
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...acc);doc.text(T('MOSKITOS 2 · TRAINING'),M,y+3);
    doc.setFontSize(20);doc.setTextColor(...ink);const tl=doc.splitTextToSize(T(s.focus||'Trainingseinheit'),CW);doc.text(tl,M,y+12);y+=12+(tl.length-1)*8;
    doc.setFont('helvetica','normal');doc.setFontSize(11);doc.setTextColor(...mute);
    doc.text(T([fmtDL(s.date),s.time?s.time+' Uhr':'',list.length+' Übungen · '+tot+' min'].filter(Boolean).join('  ·  ')),M,y+7);y+=11;
    if(s.note){doc.setFontSize(10);const nl=doc.splitTextToSize(T(s.note),CW);doc.text(nl,M,y+4);y+=nl.length*4.6+2}
    doc.setDrawColor(...ink);doc.setLineWidth(0.6);doc.line(M,y+1,W-M,y+1);y+=6;
    let cum=0;
    for(let k=0;k<list.length;k++){const x=list[k];const img=x.sketch?await imgData(imgSrc(x.sketch)):null;
      const iw=img?50:0,ih=img?Math.min(64,iw*img.h/img.w):0;const tw=CW-(img?iw+6:0);
      doc.setFontSize(10);const lines=doc.splitTextToSize(T(x.description||''),tw);
      const need=Math.max(14+Math.min(lines.length,6)*4.4,ih+4);if(y+need>BOT){doc.addPage();y=M}
      const top=y;const st=addMin(s.time,cum);cum+=+x.minutes||0;
      doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...acc);doc.text(T([(k+1)+'.',st,(x.minutes||0)+' min',x.category].filter(Boolean).join('  ·  ').toUpperCase()),M,y+3);
      doc.setFontSize(13);doc.setTextColor(...ink);const tt=doc.splitTextToSize(T(x.title),tw);doc.text(tt,M,y+9);y+=9+(tt.length-1)*5.5+5;
      doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(...ink);
      for(const ln of lines){if(y+4.4>BOT){doc.addPage();y=M}doc.text(ln,M,y);y+=4.4}
      if(img){try{doc.setDrawColor(200,206,214);doc.setLineWidth(0.2);doc.addImage(img.d,img.f,W-M-iw,top,iw,ih);doc.rect(W-M-iw,top,iw,ih)}catch(e){}y=Math.max(y,top+ih+2)}
      y+=4;if(k<list.length-1&&y<BOT-4){doc.setDrawColor(213,220,229);doc.setLineWidth(0.2);doc.line(M,y-1,W-M,y-1);y+=3}}
    const n=doc.getNumberOfPages();for(let p=1;p<=n;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...mute);doc.text(T('Moskitos 2 · '+fmtDY(s.date)),M,H-8);doc.text('Seite '+p+' / '+n,W-M,H-8,{align:'right'})}
    const blob=doc.output('blob');
    if(downloadsNS)await downloadsNS.save({filename:'Training_'+(s.date||TODAY)+'.pdf',data:blob});else plainDownload('Training_'+(s.date||TODAY)+'.pdf',blob);toast('PDF gespeichert');
  }catch(e){const c=e&&e.code;if(c==='declined'){}else if(c==='rate_limited')toast('Bitte kurz warten und erneut versuchen.');else toast('PDF konnte nicht erstellt werden.')}
  exporting=false}

async function fileToPages(file){
  const pages=[];
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){await ensurePdfjs();const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    for(let i=1;i<=Math.min(pdf.numPages,12);i++){const pg=await pdf.getPage(i);const v0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:1700/Math.max(v0.width,v0.height)});
      const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:ctx,viewport:vp}).promise;pages.push(c)}}
  else{const url=URL.createObjectURL(file);const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Bild nicht lesbar'));i.src=url});
    const sc=Math.min(1,1700/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);pages.push(c)}
  return pages}
const toBlob=(c,type,q)=>new Promise(r=>c.toBlob(r,type,q));
async function pageBlob(c){const max=(imgLim&&imgLim.maxBytes)||4.5e6;for(const q of [0.85,0.7,0.55]){const b=await toBlob(c,'image/jpeg',q);if(b&&b.size<=max)return b}const s=document.createElement('canvas');s.width=Math.round(c.width*0.7);s.height=Math.round(c.height*0.7);s.getContext('2d').drawImage(c,0,0,s.width,s.height);return toBlob(s,'image/jpeg',0.7)}
const IMP_PROMPT=n=>`Du bekommst ${n} Seitenbild(er) (Seite 1 = erstes Bild) eines Handball-Trainingsplans oder Übungsblatts einer Damenmannschaft – handschriftlich oder gedruckt, oft auf der Vorlage von handball-uebungen.de (Kästen mit "Thema", "Zeit: (Dauer' | kumuliert')", "Beschreibung" links und Spielfeld-Skizze rechts, Uhrzeiten am Rand, unten oft eine Zeile "Abschlussspiel …", oben manchmal Notizen zum Anlass).

Aufgabe: Erkenne jede einzelne Übung. Jeder Kasten = eine Übung; eine "Abschlussspiel"-Zeile = eigene Übung (Kategorie Spielform). Transkribiere die Beschreibung vollständig und gut lesbar auf Deutsch, Varianten (①, ②, a., b.) als eigene Zeilen mit \\n. Nichts erfinden; Unleserliches als [?] markieren und in "unsure" nennen.
Fachbegriffe: RL/RM/RR = Rückraum links/Mitte/rechts, LA/RA = Außen, KM = Kreis, TW = Torwart, AS = Abwehrspieler, FS = Feldspieler, "3 gg 3" = 3 gegen 3, 1./2. Welle, Sperre, Kreuzung, Parallelstoß, Übergang, Auslösehandlung, 6:0/5:1-Abwehr, offensive Deckung, TGS = Tempogegenstoß, HMT/TMH = Wurfvorgabe hoch–mitte–tief / tief–mitte–hoch, VÜ = Vorübung, F1 = 1. Mannschaft, TR = Trainer.
Kategorie: genau eine aus ${JSON.stringify(CATS.filter(c=>c!=='Sonstiges'))}.
Skizze: Wenn zur Übung eine Spielfeld-Skizze mit Einzeichnungen gehört, gib ihre Lage als Bruchteile der Bildbreite/-höhe an (0 = links/oben, 1 = rechts/unten): {"page":1,"x0":0.6,"y0":0.12,"x1":0.93,"y1":0.39} – nur das Spielfeld dieses Kastens, sonst null. Leere Spielfelder ohne Einzeichnungen: null.

Antworte NUR mit JSON in genau dieser Form:
{"theme":"Thema der Einheit oder ''","date":"JJJJ-MM-TT oder ''","analysis":"Notizen zum Anlass oder ''","drills":[{"title":"kurzer sprechender Titel","category":"Angriff","minutes":20,"description":"…","unsure":"","sketch":null}]}`;
async function readImport(files){
  const im=ui.imp;im.status='reading';im.err='';im.items=[];im.groups=[];im.ctl=new AbortController();const maxN=(imgLim&&imgLim.maxCount)||8;
  try{for(let f=0;f<files.length;f++){const file=files[f];
      im.progress=`Datei ${f+1} von ${files.length} wird vorbereitet: ${file.name}`;drawSheet();
      const pages=(await fileToPages(file)).slice(0,maxN);
      const blobs=[];for(const c of pages)blobs.push(await pageBlob(c));
      im.progress=`Claude liest ${file.name} (${pages.length} Seite${pages.length>1?'n':''}) … das dauert etwa 1–2 Minuten.`;drawSheet();
      const r=await sampleNS.json(IMP_PROMPT(pages.length),{images:blobs,modelTier:'complex',signal:im.ctl.signal});
      const drills=Array.isArray(r&&r.drills)?r.drills:[];const g={name:file.name,theme:String(r&&r.theme||''),date:/^\d{4}-\d{2}-\d{2}$/.test(r&&r.date||'')?r.date:'',analysis:String(r&&r.analysis||''),idx:[]};
      for(const d of drills){if(!d||!d.title)continue;const it={sel:true,title:String(d.title).slice(0,140),category:CATS.includes(d.category)?d.category:'Sonstiges',minutes:Math.max(0,Math.min(240,parseInt(d.minutes)||0)),description:String(d.description||''),unsure:String(d.unsure||''),g:im.groups.length};
        const sk=d.sketch;if(sk&&pages[(+sk.page||1)-1]){const c=pages[(+sk.page||1)-1];let x0=+sk.x0,y0=+sk.y0,x1=+sk.x1,y1=+sk.y1;
          if([x0,y0,x1,y1].every(v=>isFinite(v))&&x1>x0&&y1>y0){const p=0.012;x0=Math.max(0,x0-p);y0=Math.max(0,y0-p);x1=Math.min(1,x1+p);y1=Math.min(1,y1+p);
            const cw=Math.round((x1-x0)*c.width),ch=Math.round((y1-y0)*c.height);if(cw>40&&ch>40){const o=document.createElement('canvas');const sc=Math.min(1,700/cw);o.width=Math.round(cw*sc);o.height=Math.round(ch*sc);
              o.getContext('2d').drawImage(c,x0*c.width,y0*c.height,cw,ch,0,0,o.width,o.height);it.sketchBlob=await toBlob(o,'image/png');if(it.sketchBlob)it.sketchUrl=URL.createObjectURL(it.sketchBlob)}}}
        g.idx.push(im.items.length);im.items.push(it)}
      im.groups.push(g)}
    im.status='review'}
  catch(e){const c=e&&e.code;im.err=c==='cancelled'?'Abgebrochen.':c==='not_granted'?'Ohne deine Freigabe kann Claude die Dateien nicht lesen.':c==='rate_limited'?'Gerade zu viele Anfragen. Bitte in einer Minute erneut versuchen.':c==='invalid_json'?'Claude hat keine verwertbare Übungsliste geliefert. Versuch es mit einer schärferen Aufnahme.':c==='image_rejected'?'Ein Bild wurde abgelehnt (Format oder Größe).':'Lesen fehlgeschlagen'+(e&&e.message?': '+e.message:'.');
    im.status=im.items.length?'review':'idle'}
  if(ui.imp===im)drawSheet()}
async function doImport(){const im=ui.imp;im.status='saving';drawSheet();let n=0;

    for(const i of g.idx){const it=im.items[i];if(!it.sel)continue;const o={title:it.title,category:it.category,minutes:it.minutes,description:it.description,material:''};
      if(it.unsure)o.unsure=it.unsure;if(g.date||g.theme)o.source={date:g.date||TODAY,theme:g.theme||g.name,template:tid};
      if(it.sketchBlob&&assetsNS){try{const r=await assetsNS.upload(it.sketchBlob);o.sketch=r.url;o.sketchId=r.id}catch(e){}}

async function inlineImage(file){const url=URL.createObjectURL(file);try{const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});

--surface-2:#F0EBE2;--ink:#0E1B2C;--muted:#556677;--line:#E4DED4;\n  --accent:#C2410C;--accent-ink:#FFFFFF;--accent-soft:#FBE6DA;--hl:#F6C98B;--hl-ink:#1B2A4A;\n  --f-display:\"Lexend\",\"Segoe UI\",system-ui,sans-serif;--f-body:\"Lexend\",\"Segoe UI\",system-ui,sans-serif}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){--bg:#0E1B2C;--surface:#16243A;--surface-2:#1D2D47;--ink:#EEF1F5;--muted:#A3AFBD;--line:#273852;\n  --accent:#EA6A2E;--accent-ink:#0E1B2C;--accent-soft:#3a2216;--hl:#F6C98B;--hl-ink:#1B2A4A}}\n:root[data-theme=\"dark\"]{--bg:#0E1B2C;--surface:#16243A;--surface-2:#1D2D47;--ink:#EEF1F5;--muted:#A3AFBD;--line:#273852;\n  --accent:#EA6A2E;--accent-ink:#0E1B2C;--accent-soft:#3a2216;--hl:#F6C98B;--hl-ink:#1B2A4A}\nh1,h2,h3{letter-spacing:-.01em}\n<\/style>\n\n\n<header class=\"top\"><div class=\"top-in\">\n  <div class=\"brand\"><small>Moskitos 2 · Saison 2026/27<\/small><b id=\"vtitle\">Trainertool<\/b><\/div>\n  <span id=\"sync\" class=\"sync\">Lädt …<\/span>\n  <button class=\"iconbtn\" id=\"menuBtn\" data-a=\"admin\" aria-label=\"Verwaltung und Zugang\" hidden><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"3.6\"/><path d=\"M4.5 20c.9-3.9 3.9-6 7.5-6s6.6 2.1 7.5 6\"/><\/svg><\/button>\n<\/div><\/header>\n<main><div class=\"wrap\" id=\"view\"><div class=\"empty\"><b>Daten werden geladen<\/b>Übungen, Spiele, Kader und Kosten erscheinen gleich.<\/div><\/div><\/main>\n<nav class=\"tabs\" aria-label=\"Bereiche\"><div class=\"tabs-in\" id=\"tabs\"><\/div><\/nav>\n<div id=\"sheetroot\"><\/div>\n<div id=\"toast\" class=\"toast\" hidden><\/div>\n<div class=\"login\" id=\"login\" hidden>\n  <form id=\"loginForm\" autocomplete=\"on\">\n    <div class=\"crest\"><div class=\"badge\" aria-hidden=\"true\"><span>F2<\/span><\/div><div><h1>Moskitos 2<\/h1><p>Trainertool · Anmeldung<\/p><\/div><\/div>\n    <label for=\"lgUser\">Benutzername<input type=\"text\" id=\"lgUser\" name=\"username\" autocomplete=\"username\" autocapitalize=\"none\" spellcheck=\"false\" required><\/label>\n    <label for=\"lgPass\">Passwort<input type=\"password\" id=\"lgPass\" name=\"password\" autocomplete=\"current-password\" required><\/label>\n    <label class=\"chk2\" for=\"lgKeep\"><input type=\"checkbox\" id=\"lgKeep\"> Auf diesem Gerät angemeldet bleiben<\/label>\n    <button type=\"submit\" id=\"lgBtn\">Anmelden<\/button>\n    <p class=\"msg\" id=\"lgMsg\" role=\"alert\"><\/p>\n    <p class=\"hint\">Zugang nur für das Trainerteam und die Mannschaft der Moskitos 2.<\/p>\n  <\/form>\n<\/div>\n\n<script>\n(function(){\nconst $=s=>document.querySelector(s);\nconst esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst WD=['So','Mo','Di','Mi','Do','Fr','Sa'];\nconst MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];\nconst MONL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];\nconst pad=n=>String(n).padStart(2,'0');\nconst isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());\nconst TODAY=isoOf(new Date());\nconst dt=iso=>new Date(iso+'T12:00:00');\nconst fmtD=iso=>{if(!iso)return '';const d=dt(iso);return WD[d.getDay()]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.';};\nconst fmtDY=iso=>{if(!iso)return '';const d=dt(iso);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();};\nconst fmtDL=iso=>{if(!iso)return '';const d=dt(iso);return WD[d.getDay()]+', '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();};\nconst eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n||0);\nconst uid=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);\nconst clone=o=>JSON.parse(JSON.stringify(o||{}));\n\nconst CATS=['Aufwärmen','Koordination','Abwehr','Angriff','Umschaltspiel','Wurftraining','Torwart','Kondition','Spielform','Sonstiges'];\nconst CATVAR={'Aufwärmen':'--c-auf','Abwehr':'--c-abw','Angriff':'--c-ang','Torwart':'--c-tw','Kondition':'--c-kon','Spielform':'--c-spi','Umschaltspiel':'--c-ums','Wurftraining':'--c-wur','Koordination':'--c-koo'};\nconst catTag=c=>`<span class=\"cat\" style=\"--cc:var(${CATVAR[c]||'--c-son'})\">${esc(c||'Sonstiges')}<\/span>`;\nconst POS=['TW','LA','RL','RM','RR','RA','KM'];\nconst KADER=[['F2','Stammkader F2'],['Backup','Backup'],['A-Jgd.','A-Jugend'],['F3','F3'],['F4','F4'],['F1','F1']];\nconst ST={x:'Dabei','?':'Offen',o:'Absage','-':'Nicht nominiert'};\nconst SLOTN=['Zeitnehmer','Sekretär','Helfer','Helfer'];\n\n/* ---------- Store ---------- */\nconst COLS=['players','games','drills','sessions','templates','staff','refs','settings'];\nconst S={};COLS.forEach(c=>S[c]={});\nlet db=null,mode='loading',readOnly=false;const loaded=new Set();const pend=new Map();\nconst LOCKED=window.__MK2T_LOCKED__||null;\nconst PRISTINE=(()=>{try{if(!LOCKED)return null;const c=document.documentElement.cloneNode(true);const d=c.querySelector('#mkdata');if(!d)return null;d.textContent='window.__MK2T_LOCKED__=/*__DATA__*/null;';return '<!doctype html>\\n'+c.outerHTML}catch(e){return null}})();\nlet BLOBS={},ACCESS=null,USER=null,ROLE=null,RAW=null,BASEAT=null,DIRTY=0;\nconst canEdit=()=>ROLE==='admin'||ROLE==='trainer';\nconst roleName=r=>({admin:'Admin',trainer:'Trainer',spieler:'Spielerin'}[r]||'Spielerin');\nfunction imgSrc(u){if(!u)return '';if(u.startsWith('inline:'))return BLOBS[u.slice(7)]||'';if(mode==='static'&&u.startsWith('/_blob/'))return BLOBS[u.slice(7)]||'';return u}\nconst LKEY='moskitos2-trainertool-v1';\nconst all=col=>Object.entries(S[col]).map(([id,v])=>Object.assign({id},v));\nconst cfg=()=>Object.assign({srAdvance:1000,maxSquad:16},S.settings.main||{});\n\nfunction saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify(S))}catch(e){}}\nfunction loadLocal(){try{const o=JSON.parse(localStorage.getItem(LKEY)||'null');if(o)COLS.forEach(c=>S[c]=o[c]||{})}catch(e){}}\nfunction put(col,id,data){if(readOnly){toast('Du hast hier nur Leserechte.');return}S[col]=Object.assign({},S[col],{[id]:data});if(mode==='static')DIRTY++;queue(col,id,data);render()}\nfunction del(col,id){if(readOnly){toast('Du hast hier nur Leserechte.');return}const c=Object.assign({},S[col]);delete c[id];S[col]=c;if(mode==='static')DIRTY++;queue(col,id,null);render()}\nfunction queue(col,id,data){const k=col+'/'+id;let p=pend.get(k);if(!p){p={};pend.set(k,p)}p.data=data;p.dirty=true;clearTimeout(p.timer);p.timer=setTimeout(()=>flush(k),350);syncChip()}\nasync function flush(k){const p=pend.get(k);if(!p||p.inflight)return;p.inflight=true;\n  while(p.dirty){p.dirty=false;const data=p.data;\n    try{await write(k,data)}catch(e){\n      const code=e&&e.code;\n      if(code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await write(k,data)}catch(e2){toast('Speichern fehlgeschlagen. Bitte später erneut versuchen.')}}\n      else if(code==='invalid_argument'){readOnly=true;toast('Speichern nicht möglich: Du hast hier nur Leserechte.')}\n      else if(code==='quota_exceeded'){toast('Speicher voll. Lösche alte Einträge und versuche es erneut.')}\n      else toast('Speichern fehlgeschlagen.');\n    }}\n  p.inflight=false;if(!p.dirty)pend.delete(k);syncChip()}\nasync function write(k,data){if(mode==='db'){const ref=db.doc(k);if(data===null)await ref.delete();else await ref.set(data)}else if(mode==='static')await saveDraft();else saveLocal()}\nfunction syncChip(){const el=$('#sync');if(mode==='loading'){el.className='sync';el.textContent='Lädt …';return}\n  if(mode==='local'){el.className='sync local';el.textContent='Nur dieses Gerät';return}\n  if(mode==='static'){if(readOnly){el.className='sync ok';el.textContent='Nur lesen'}else if(DIRTY){el.className='sync busy';el.textContent=DIRTY+' Änderung'+(DIRTY===1?'':'en')}else{el.className='sync ok';el.textContent='Aktuell'}return}\n  if(pend.size){el.className='sync busy';el.textContent='Speichert …'}else{el.className='sync ok';el.textContent=readOnly?'Nur lesen':'Gespeichert'}}\n\nasync function boot(){\n  if(LOCKED){bootLocked();return}\n  ROLE='admin';\n  render();\n  let ns=null;\n  try{ns=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){ns=null}\n  if(ns){db=ns;mode='db';if(window.MKFB&&MKFB.role)ROLE=MKFB.role;\n    COLS.forEach(col=>{db.collection(col).onSnapshot(snap=>{\n      const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});\n      for(const [k,p] of pend){const i=k.indexOf('/');if(k.slice(0,i)===col){const id=k.slice(i+1);if(p.data===null)delete o[id];else o[id]=p.data}}\n      S[col]=o;loaded.add(col);render();syncChip()},\n      err=>{if(err&&err.code==='revoked'){readOnly=true}loaded.add(col);render()})});\n    try{assetsNS=await window.claude.use('assets')}catch(e){assetsNS=null}\n    try{downloadsNS=await window.claude.use('downloads')}catch(e){downloadsNS=null}\n    try{sampleNS=await window.claude.use('sample');if(sampleNS){const l=await sampleNS.limits().catch(()=>null);imgOK=!!(l&&l.images);imgLim=l&&l.images||null}}catch(e){sampleNS=null}\n    render();\n    try{const u=await window.claude.use('user');if(u&&u.can){const c=await u.can('data.write');if(c===false)readOnly=true}}catch(e){}\n  }else{mode='local';loadLocal();COLS.forEach(c=>loaded.add(c))}\n  if(mode==='db')$('#menuBtn').hidden=false;\n  syncChip();render();\n}\n\n/* ---------- Verschlüsselung & Anmeldung (kompatibel zur Spielanalyse) ---------- */\nconst ITER=310000;const TE=new TextEncoder(),TD=new TextDecoder();\nconst b64e=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)};\nconst b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));\nconst normUser=u=>String(u||'').trim().toLowerCase();\nasync function sha(s){const d=new Uint8Array(await crypto.subtle.digest('SHA-256',TE.encode('moskitos2:'+s)));return [...d].map(b=>b.toString(16).padStart(2,'0')).join('')}\nasync function kek(pw,salt,iter){const base=await crypto.subtle.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}\nasync function wrapFor(user,pw,raw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await kek(pw,salt,ITER);\n  const wk=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:TE.encode(user)},k,raw));return {u:user,salt:b64e(salt),iter:ITER,iv:b64e(iv),wk:b64e(wk)}}\nasync function sealPayload(raw,obj){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt']);const iv=crypto.getRandomValues(new Uint8Array(12));\n  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,TE.encode(JSON.stringify(obj))));return {iv:b64e(iv),ct:b64e(ct)}}\nasync function openPayload(raw,L){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);\n  return JSON.parse(TD.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(L.iv)},key,b64d(L.ct))))}\nasync function unlockKey(user,pw,L){const h=await sha(user);const e=L.users.find(x=>x.h===h);if(!e)throw new Error('auth');\n  const k=await kek(pw,b64d(e.salt),e.iter);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(e.iv),additionalData:TE.encode(user)},k,b64d(e.wk)))}\n\nasync function saveDraft(){if(mode!=='static'||!RAW)return;try{const inl={};Object.keys(BLOBS).filter(k=>k.startsWith('img-')).forEach(k=>inl[k]=BLOBS[k]);\n  const sealed=await sealPayload(RAW,{baseAt:BASEAT,dirty:DIRTY,data:S,blobs:inl,users:ACCESS.users});localStorage.setItem('mk2tdraft',JSON.stringify(sealed))}catch(e){toast('Änderung konnte auf diesem Gerät nicht gesichert werden.')}}\nasync function loadDraft(){try{const r=localStorage.getItem('mk2tdraft');if(!r)return null;const d=await openPayload(RAW,JSON.parse(r));if(d.baseAt!==BASEAT){localStorage.removeItem('mk2tdraft');return null}return d}catch(e){return null}}\nasync function bootStatic(D,raw,user){\n  RAW=raw;USER=user;BASEAT=D.exportedAt||null;BLOBS=D.blobs||{};\n  const users=(D.access&&D.access.users)||[];const me=users.find(u=>u.u===user);ROLE=me?(me.role||'spieler'):'spieler';\n  ACCESS={dataKey:b64e(raw),users};\n  COLS.forEach(c=>S[c]=(D.data&&D.data[c])||{});\n  if(canEdit()){const dr=await loadDraft();if(dr){COLS.forEach(c=>S[c]=(dr.data&&dr.data[c])||S[c]);Object.assign(BLOBS,dr.blobs||{});ACCESS.users=dr.users||ACCESS.users;DIRTY=dr.dirty||1}}\n  readOnly=!canEdit();document.body.classList.toggle('ro',readOnly);\n  mode='static';COLS.forEach(c=>loaded.add(c));\n  if(!canEdit()&&ui.tab==='sr')ui.tab='spiele';\n  $('#login').hidden=true;$('#menuBtn').hidden=false;syncChip();render();\n}\nasync function tryKey(raw,L,user){const D=await openPayload(raw,L);await bootStatic(D,raw,user)}\nfunction bootLocked(){\n  const showLogin=()=>{if(window.MKSite&&MKSite.redirect('training'))return;$('#login').hidden=false;setTimeout(()=>{const i=$('#lgUser');if(i)i.focus()},50)};\n  if(!(window.crypto&&crypto.subtle)){showLogin();$('#lgMsg').textContent='Dieser Browser unterstützt die Anmeldung nicht. Bitte in Safari oder Chrome öffnen.';return}\n  let sv=null;try{sv=JSON.parse(sessionStorage.getItem('mk2tkey')||localStorage.getItem('mk2tkey')||'null')}catch(x){}\n  if(sv&&sv.k&&sv.u){tryKey(b64d(sv.k),LOCKED,sv.u).catch(()=>{try{sessionStorage.removeItem('mk2tkey');localStorage.removeItem('mk2tkey')}catch(x){}showLogin()})}else showLogin();\n}\nasync function doLogin(){\n  const btn=$('#lgBtn'),msg=$('#lgMsg');const u=normUser($('#lgUser').value),pw=$('#lgPass').value;if(!u||!pw)return;\n  btn.disabled=true;btn.textContent='Anmeldung läuft …';msg.textContent='';\n  try{const raw=await unlockKey(u,pw,LOCKED);await tryKey(raw,LOCKED,u);\n    const store=$('#lgKeep').checked?localStorage:sessionStorage;try{store.setItem('mk2tkey',JSON.stringify({u,k:b64e(raw)}))}catch(x){}}\n  catch(e){msg.textContent='Benutzername oder Passwort stimmt nicht.'}\n  btn.disabled=false;btn.textContent='Anmelden'}\nfunction logout(){if(window.MKSite&&MKSite.logout())return;try{sessionStorage.removeItem('mk2tkey');localStorage.removeItem('mk2tkey')}catch(x){}location.reload()}\n\n/* ---------- Website-Export & Abgleich ---------- */\nasync function loadAccess(){if(mode!=='db')return ACCESS;try{const d=await db.doc('secure/access').get();ACCESS=d.exists?clone(d.data()):null}catch(e){ACCESS=null}return ACCESS}\nasync function saveAccess(A){if(mode==='db'){await db.doc('secure/access').set(A);ACCESS=A}else{ACCESS=A;DIRTY++;await saveDraft()}}\nfunction referencedImgs(){const set=new Set();all('drills').forEach(d=>{if(d.sketch)set.add(d.sketch)});all('templates').forEach(t=>{if(t.extraSketch)set.add(t.extraSketch)});return [...set]}\nasync function toDataURL(url){const r=await fetch(url);if(!r.ok)throw new Error('img');const b=await r.blob();return await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)})}\nasync function buildSite(){\n  const A=mode==='db'?await loadAccess():ACCESS;\n  if(!A||!A.dataKey||!(A.users||[]).length)throw Object.assign(new Error('noaccess'),{code:'noaccess'});\n  const tpl=mode==='static'?PRISTINE:window.__MK2T_TPL__;if(!tpl)throw Object.assign(new Error('tpl'),{code:'tpl'});\n  const raw=b64d(A.dataKey);const blobs={};\n  for(const u of referencedImgs()){const id=u.startsWith('inline:')?u.slice(7):u.startsWith('/_blob/')?u.slice(7):null;if(!id)continue;\n    if(BLOBS[id]){blobs[id]=BLOBS[id];continue}if(u.startsWith('/_blob/')&&mode==='db'){try{blobs[id]=await toDataURL(u)}catch(e){}}}\n  const data={};COLS.forEach(c=>data[c]=S[c]);\n  const inner=A.users.map(u=>({u:u.u,role:u.role||'spieler',salt:u.salt,iter:u.iter,iv:u.iv,wk:u.wk}));\n  const now=new Date().toISOString();\n  const sealed=await sealPayload(raw,{data,blobs,exportedAt:now,access:{users:inner}});\n  const users=[];for(const u of A.users)users.push({h:await sha(u.u),salt:u.salt,iter:u.iter,iv:u.iv,wk:u.wk});\n  const locked={v:1,iv:sealed.iv,ct:sealed.ct,users};\n  return tpl.replace('/*__DATA__*/null',()=>JSON.stringify(locked).replace(/<\/g,'\\\\u003c'));\n}\nfunction plainDownload(name,blob){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}\nlet siteBusy=false;\nasync function exportSite(){if(siteBusy)return;siteBusy=true;toast('index.html wird erstellt …');\n  try{const html=await buildSite();const blob=new Blob([html],{type:'text/html'});\n    if(mode==='db'){if(!downloadsNS)throw Object.assign(new Error('dl'),{code:'dl'});await downloadsNS.save({filename:'index.html',data:blob})}else plainDownload('index.html',blob);\n    toast('index.html erstellt – jetzt bei Netlify hochladen')}\n  catch(e){console.error('export',e);const c=e&&e.code;toast(c==='noaccess'?'Lege zuerst einen Zugang an.':c==='declined'?'Abgebrochen.':c==='dl'?'Herunterladen ist hier nicht möglich.':'Export fehlgeschlagen.')}\n  siteBusy=false}\nasync function readSiteFile(f){\n  const txt=await f.text();const m=txt.match(/window\\.__MK2T_LOCKED__=(\\{[\\s\\S]*?\\});<\\/script>/);if(!m)throw Object.assign(new Error('format'),{code:'format'});\n  const A=await loadAccess();if(!A||!A.dataKey)throw Object.assign(new Error('key'),{code:'key'});\n  try{return await openPayload(b64d(A.dataKey),JSON.parse(m[1]))}catch(e){throw Object.assign(new Error('key'),{code:'key'})}}\nasync function applySite(D){\n  const total=COLS.reduce((a,c)=>a+Object.keys((D.data||{})[c]||{}).length,0);let n=0;\n  const up={};\n  for(const c of COLS){const inc=(D.data||{})[c]||{};\n    for(const [id,v] of Object.entries(inc)){let o=clone(v);\n      for(const f of ['sketch','extraSketch']){if(typeof o[f]==='string'&&o[f].startsWith('inline:')){const bid=o[f].slice(7);\n        if(up[bid])o[f]=up[bid];else if(assetsNS&&D.blobs&&D.blobs[bid]){try{const b=await (await fetch(D.blobs[bid])).blob();const r=await assetsNS.upload(b);up[bid]=r.url;o[f]=r.url}catch(e){}}}}\n      if(JSON.stringify(o)!==JSON.stringify(S[c][id]))await db.doc(c+'/'+id).set(o);n++;if(n%20===0)toast('Übernehme … '+n+' / '+total)}\n    for(const id of Object.keys(S[c]))if(!(id in inc))await db.doc(c+'/'+id).delete()}\n  const A=await loadAccess();if(A&&D.access&&(D.access.users||[]).length){await saveAccess(Object.assign({},A,{users:D.access.users}))}\n  toast('Stand aus der Netlify-Datei übernommen')}\n\n/* ---------- UI state ---------- */\nconst ui={tab:'uebungen',q:'',cat:'Alle',showPast:false,gamesAll:false,znPast:false,game:null,players:false,sheet:null,draft:null,confirm:false,picker:false,pcat:'Alle',expandHelp:false,tview:'plan',pq:''};\ntry{const h=location.hash.slice(1);const t=localStorage.getItem('m2-tab');ui.tab=['uebungen','training','spiele','zn','sr'].includes(h)?h:(t||ui.tab)}catch(e){}\nconst TABS=[\n ['uebungen','Übungen','<path d=\"M4 6h16M4 12h16M4 18h10\"/>'],\n ['training','Training','<rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15\" rx=\"2\"/><path d=\"M3.5 10h17M8 3v4M16 3v4\"/>'],\n ['spiele','Kader','<circle cx=\"9\" cy=\"8\" r=\"3.2\"/><path d=\"M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5\"/><circle cx=\"17\" cy=\"9\" r=\"2.4\"/><path d=\"M15.5 14.2c2.4-.3 4.4 1.2 5 4.3\"/>'],\n ['zn','ZN / Sek','<circle cx=\"12\" cy=\"13\" r=\"7.5\"/><path d=\"M12 9v4l2.5 2M10 2.5h4\"/>'],\n ['sr','SR-Kosten','<path d=\"M17.5 6.5A7 7 0 1 0 17.5 17.5\"/><path d=\"M4 10.5h9M4 13.5h9\"/>']];\nfunction renderTabs(){const T_=TABS.filter(t=>!(t[0]==='sr'&&mode==='static'&&!canEdit()));$('#tabs').style.gridTemplateColumns='repeat('+T_.length+',1fr)';$('#tabs').innerHTML=T_.map(([k,l,ic])=>`<button class=\"tab\" data-a=\"tab\" data-v=\"${k}\" ${ui.tab===k?'aria-current=\"page\"':''}><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\">${ic}<\/svg>${l}<\/button>`).join('')}\n\nlet rq=false;\nfunction render(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;draw()})}\nfunction keepFocus(root,fn){const ae=document.activeElement;const id=ae&&ae.id&&root.contains(ae)?ae.id:null;let sel=null;try{if(id&&ae.selectionStart!=null)sel=[ae.selectionStart,ae.selectionEnd]}catch(e){}\n  fn();if(id){const el=document.getElementById(id);if(el){el.focus({preventScroll:true});if(sel)try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}}\nfunction draw(){renderTabs();const v=$('#view');\n  const titles={uebungen:'Übungen',training:'Saisonplanung',spiele:ui.players?'Spielerinnen':'Kaderplaner',zn:'ZN & Sekretäre',sr:'SR-Kosten'};\n  $('#vtitle').textContent=titles[ui.tab];\n  keepFocus(v,()=>{v.innerHTML=(loaded.size<COLS.length&&mode!=='local')?`<div class=\"empty\"><b>Daten werden geladen<\/b>Einen Moment …<\/div>`:(VIEWS[ui.tab]()+localNote())})}\nfunction localNote(){return mode==='local'?`<p class=\"note\">Vorschau-Modus: Änderungen werden nur in diesem Browser gespeichert.<\/p>`:''}\n\n/* ---------- Helpers ---------- */\nconst gamesSorted=()=>all('games').sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));\nconst nextGame=()=>gamesSorted().find(g=>g.date>=TODAY);\nconst haTag=g=>g.home===true?'<span class=\"pill h\">Heim<\/span>':g.home===false?'<span class=\"pill a\">Auswärts<\/span>':'<span class=\"pill\">offen<\/span>';\nconst compTag=g=>!g.comp||g.comp==='Liga'?'':(/Pokal/.test(g.comp)?`<span class=\"pill pokal\">${esc(g.comp)}<\/span>`:`<span class=\"pill\">${esc(g.comp)}<\/span>`);\nfunction dateBox(iso,next){const d=dt(iso);return `<div class=\"datebox ${next?'next':''}\"><div class=\"wd\">${WD[d.getDay()]}<\/div><div class=\"dd num\">${d.getDate()}<\/div><div class=\"mm\">${MON[d.getMonth()]}<\/div><\/div>`}\nfunction tally(g){const t={x:0,'?':0,o:0,'-':0,tw:0};const sq=g.squad||{};for(const pid in sq){const s=sq[pid];if(t[s]!=null)t[s]++;if(s==='x'&&(S.players[pid]||{}).pos==='TW')t.tw++}return t}\nconst sessMin=s=>(s.drill
